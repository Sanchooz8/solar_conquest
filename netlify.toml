# Netlify : à chaque mise à jour du dépôt GitHub, le jeu est assemblé
# (npm run build) puis le dossier dist/ est mis en ligne.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Toujours vérifier la dernière version du jeu (pas de copie périmée en cache)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
